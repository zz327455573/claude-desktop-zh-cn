name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 pytest
        run: python -m pip install --upgrade pip pytest

      - name: 跑测试套件
        run: python -m pytest tools/test_install.py -v

      - name: 校验语言包 JSON 合法性与扁平结构
        shell: python
        run: |
          import json, sys, pathlib
          ok = True
          for name in ('zh-CN.json', 'zh-CN-dynamic.json'):
              p = pathlib.Path(name)
              if not p.exists():
                  print(f'缺少 {name}'); sys.exit(1)
              data = json.loads(p.read_text(encoding='utf-8-sig'))
              assert isinstance(data, dict) and data, f'{name} 不是非空对象'
              bad = [k for k, v in data.items() if not isinstance(v, str)]
              if bad:
                  print(f'{name} 有 {len(bad)} 个非字符串值'); ok = False
              empty = [k for k, v in data.items() if not v.strip()]
              if empty:
                  print(f'{name} 有 {len(empty)} 条空译文'); ok = False
              print(f'{name}: {len(data)} 条, 结构 OK')
          sys.exit(0 if ok else 1)

      - name: 占位符与 ICU 结构一致性（防白屏）
        shell: python
        run: |
          # 语言包与参考译本逐条比对占位符签名。不一致会让 react-intl 运行时抛错，
          # 比译错更严重，所以这一关不过就不允许合并。
          import json, re, sys, pathlib
          sys.path.insert(0, 'tools')
          from test_install import signature
          root = pathlib.Path('.')
          ref_p = root / 'docs' / 'reference-zh-CN.json'
          if not ref_p.exists():
              print('没有 docs/reference-zh-CN.json，跳过一致性比对'); sys.exit(0)
          ref = json.loads(ref_p.read_text(encoding='utf-8-sig'))
          zh = json.loads((root / 'zh-CN.json').read_text(encoding='utf-8-sig'))
          bad = [k for k, v in ref.items()
                 if k in zh and signature(zh[k]) != signature(v)]
          if bad:
              print(f'{len(bad)} 条占位符不一致:')
              for k in bad[:10]:
                  print(f'  {k}\n    参考: {ref[k][:100]}\n    语言包: {zh[k][:100]}')
              sys.exit(1)
          print(f'占位符一致性 OK（比对了 {len(ref)} 条）')

      - name: 检查 .bat 使用 CRLF 换行
        shell: bash
        run: |
          # Windows 批处理用 LF 会导致双击运行时解析异常
          for f in *.bat; do
            [ -e "$f" ] || continue
            lf=$(tr -cd '\n' < "$f" | wc -c)
            crlf=$(grep -c $'\r$' "$f" || true)
            if [ "$lf" != "$crlf" ]; then
              echo "$f 换行不是 CRLF（LF=$lf CRLF=$crlf）"; exit 1
            fi
            echo "$f: CRLF OK"
          done

      - name: 校验 SHA256SUMS.txt
        shell: bash
        run: |
          if [ ! -f SHA256SUMS.txt ]; then
            echo '没有 SHA256SUMS.txt，跳过'; exit 0
          fi
          sha256sum -c SHA256SUMS.txt
