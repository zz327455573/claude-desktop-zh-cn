name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 pytest
        run: python -m pip install --upgrade pip pytest

      - name: 跑测试套件
        run: python -m pytest tools/test_install.py -v

      - name: 校验语言包 JSON 合法性与扁平结构
        shell: python
        run: |
          # 注意：GitHub Actions 的 Windows runner 默认 stdout 编码是 cp1252，
          # print 中文会 UnicodeEncodeError。所以这里只用 ASCII 输出。
          import json, sys, pathlib
          ok = True
          for name in ('zh-CN.json', 'zh-CN-dynamic.json'):
              p = pathlib.Path(name)
              if not p.exists():
                  print(f'missing {name}'); sys.exit(1)
              data = json.loads(p.read_text(encoding='utf-8-sig'))
              assert isinstance(data, dict) and data, f'{name} not a non-empty object'
              bad = [k for k, v in data.items() if not isinstance(v, str)]
              if bad:
                  print(f'{name}: {len(bad)} non-string values'); ok = False
              empty = [k for k, v in data.items() if not v.strip()]
              if empty:
                  print(f'{name}: {len(empty)} empty values'); ok = False
              print(f'{name}: {len(data)} entries, structure OK')
          sys.exit(0 if ok else 1)

      - name: 占位符与 ICU 结构一致性（防白屏）
        shell: python
        run: |
          # 语言包与参考译本逐条比对占位符签名。不一致会让 react-intl 运行时抛错，
          # 比译错更严重，所以这一关不过就不允许合并。
          # 同样只用 ASCII 输出（Windows runner stdout 默认 cp1252）。
          import json, sys, pathlib
          sys.path.insert(0, 'tools')
          from test_install import signature
          root = pathlib.Path('.')
          ref_p = root / 'docs' / 'reference-zh-CN.json'
          if not ref_p.exists():
              print('no docs/reference-zh-CN.json, skip'); sys.exit(0)
          ref = json.loads(ref_p.read_text(encoding='utf-8-sig'))
          zh = json.loads((root / 'zh-CN.json').read_text(encoding='utf-8-sig'))
          bad = [k for k, v in ref.items()
                 if k in zh and signature(zh[k]) != signature(v)]
          if bad:
              print(f'{len(bad)} placeholder mismatches:')
              for k in bad[:10]:
                  print(f'  {k}')
                  print(f'    ref: {ref[k][:100]}')
                  print(f'    zh : {zh[k][:100]}')
              sys.exit(1)
          print(f'placeholder consistency OK ({len(ref)} entries compared)')

      - name: 检查 .bat 使用 CRLF 换行
        shell: bash
        run: |
          # Windows 批处理用 LF 会导致双击运行时解析异常
          for f in *.bat; do
            [ -e "$f" ] || continue
            lf=$(tr -cd '\n' < "$f" | wc -c)
            crlf=$(grep -c $'\r$' "$f" || true)
            if [ "$lf" != "$crlf" ]; then
              echo "$f 换行不是 CRLF（LF=$lf CRLF=$crlf）"; exit 1
            fi
            echo "$f: CRLF OK"
          done

      - name: 校验 SHA256SUMS.txt
        shell: bash
        run: |
          if [ ! -f SHA256SUMS.txt ]; then
            echo 'no SHA256SUMS.txt, skip'; exit 0
          fi
          # git 可能把文本文件按 CRLF 检出，行尾的 \r 会让 sha256sum 找不到文件，
          # 所以先剥掉 \r 再校验。
          tr -d '\r' < SHA256SUMS.txt > /tmp/sums.txt
          sha256sum -c /tmp/sums.txt
